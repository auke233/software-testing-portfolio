# GitHub Actions 持续集成：每次推送代码自动跑 pytest
# 触发：main 分支收到 push 或任意 Pull Request 时运行
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # 1. 把仓库代码拉到这台虚拟机上
      - uses: actions/checkout@v4

      # 2. 安装 Python 3.11
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. 安装项目依赖
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4. 运行接口自动化测试（13 条）
      - name: Run tests
        run: python -m pytest tests/ -v
